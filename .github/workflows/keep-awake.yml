name: Keep Streamlit App Awake

on:
  schedule:
    # Runs every 6 hours (at 00:00, 06:00, 12:00, and 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run it manually to test

jobs:
  wake-up:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium

      - name: Visit App and Click Wake Button
        run: |
          python -c "
          from playwright.sync_api import sync_playwright

          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              print('Opening app...')
              page.goto('https://streamlit.app', timeout=60000)
              page.wait_for_timeout(5000)

              # Look for the wake-up button and click it if present
              wake_button = page.locator('button:has-text(\"get this app back up\")')
              if wake_button.count() > 0:
                  print('App is asleep. Clicking wake-up button...')
                  wake_button.first.click()
                  page.wait_for_timeout(15000)
                  print('Wake-up triggered!')
              else:
                  print('App is already awake!')

              browser.close()
          "
